<!-- Kopfzeile, Fußzeile, Login und „Melden" fügt gemeinsam/shell.js ein. -->

<main id="page-home" class="page active">
  <div class="back-row">
    <a class="back-btn" href="../index.html">← Startseite</a>
  </div>
  <div class="topic-head">
    <h1 class="topic-title">Meldungen</h1>
  </div>
  <div id="meld-locked" class="empty-hint">
    Diese Seite ist nur für Admins.
    <div><button class="start-btn btn--mt" onclick="App.openLogin()">Einloggen</button></div>
  </div>
  <div id="meld-body" class="hidden">
    <div class="meld-toolbar">
      <span class="vok-count-badge" id="meld-summary"></span>
      <button class="outline-btn btn--sm" id="meld-toggle-read" onclick="Meldungen.toggleRead()">Erledigte anzeigen</button>
      <button class="outline-btn btn--sm" onclick="Meldungen.load()">Neu laden</button>
    </div>
    <div id="meld-list"></div>
  </div>
</main>
